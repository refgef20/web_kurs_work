<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/light.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/catalog.css" />
    <link rel="stylesheet" href="../css/media_catalog.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <script type="module" src="../js/pages/language.js"></script>
    <script type="module" src="/frontend/js/pages/components.js"></script>
    <script type="module" src="/frontend/js/pages/feedback.js"></script>
    <script type="module" src="../js/pages/load.js"></script>
  </head>
  <body>
    <site-header></site-header>
    <main>
      <section class="container-for-catalog" style="align-items: center">
        <div class="form-wrapper">
          <h2 class="form-title" data-i18n="feedback.title">Оставьте отзыв</h2>
          <form id="feedback-form" novalidate>
            <div class="input-group">
              <label for="review-product" data-i18n="feedback.select_product"
                >Выберите продукт*</label
              >
              <select
                id="review-product"
                style="
                  padding: 10px;
                  border-radius: 8px;
                  border: 1px solid #ccc;
                "
                required
              >
                <option value="" data-i18n="feedback.select_placeholder">
                  Выберите купленный продукт
                </option>
              </select>
            </div>

            <div class="input-group">
              <label for="review-text" data-i18n="feedback.review_text"
                >Ваш отзыв (Минимум 20 символов) *</label
              >
              <textarea
                id="review-text"
                rows="5"
                style="
                  border-radius: 8px;
                  border: 1px solid #ccc;
                  padding: 10px;
                "
                required
              ></textarea>
              <small
                id="char-counter"
                style="color: #666; margin-top: 4px; font-size: 0.8rem"
                >Symbols: 0</small
              >
            </div>

            <button
              type="submit"
              id="feedback-submit-btn"
              class="submit-btn"
              data-i18n="feedback.submit_btn"
              disabled
            >
              Submit Review
            </button>
          </form>
        </div>
      </section>
    </main>
    <site-footer></site-footer>
  </body>
</html>
